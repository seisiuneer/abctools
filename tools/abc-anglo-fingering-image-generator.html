<script>

var gInjectTab_ConcertinaFingering = 0;
var gInjectTab_ConcertinaStyle = 0;
var gInjectTab_GaryCoover = false;
// Preserve physical button identity so the image renderer can highlight the exact button.
var gAngloButtonNames = [
 "L1a","L2a","L3a","L4a","L5a","R1a","R2a","R3a","R4a","R5a",
 "L1","L2","L3","L4","L5","R1","R2","R3","R4","R5",
 "L6","L7","L8","L9","L10","R6","R7","R8","R9","R10"
];

//
// app-anglo-fingerings.js
//
// ABC Muscial Notation Converter for Anglo Concertina
//
// This version for integration into the ABC Transcription Tools
//
// Annotates an ABC format tune with semi-optimal fingerings
// for the Anglo Concertina.
//
// This code is a fork of the original Anglo Concertina fingering utility at:
//
// https://jvandonsel.github.io/fingering/fingering.html
//
// Updated and extended 19 July 2023 by: 
//
// Michael Eskin
// https://michaeleskin.com
//
// Copyright (c) 2013 James van Donsel
//
// Released under CC0 - No Rights Reserved
// https://creativecommons.org/share-your-work/public-domain/cc0/
//

//
// Put the whole thing in a function for isolation
//
var angloFingeringsGenerator = function (theABC, callback){

    var gAngloVerbose = false;

    var abcOutput = "";

    // *** CHANGE: collect tunes that needed `x` substitutions
    var tunesWithX = [];
    var currentTuneHadX = false;

    // Button constructor
    var Button = function(name, notes, cost, finger) {
        this.name = name;
        this.notes = notes;
        this.cost = cost;
        this.finger = finger;
    };

    // Button maps
    // Lower cost means button is preferred
    // Notes are [PUSH, DRAW].
    var PUSH_INDEX = 0;
    var DRAW_INDEX = 1;

    var baseMapOriginal = {

        // Top row, LH
        "L1a": new Button("L1a", ["E,", "F,"], 10, "l4"),
        "L2a": new Button("L2a", ["A,", "_B,"], 10, "l4"),
        "L3a": new Button("L3a", ["^C", "_E"], 10, "l3"),
        "L4a": new Button("L4a", ["A", "G"], 10, "l2"),
        "L5a": new Button("L5a", ["^G", "_B"], 10, "l1"),

        // Middle row, LH
        "L1": new Button("L1", ["C,", "G,"], 1, "l4"),
        "L2": new Button("L2", ["G,", "B,"], 1, "l4"),
        "L3": new Button("L3", ["C", "D"], 1, "l3"),
        "L4": new Button("L4", ["E", "F"], 1, "l2"),
        "L5": new Button("L5", ["G", "A"], 1, "l1"),

        // Bottom row, LH
        "L6": new Button("L6", ["B,", "A,"], 1, "l4"),
        "L7": new Button("L7", ["D", "^F"], 2, "l4"),
        "L8": new Button("L8", ["G", "A"], 2, "l3"),
        "L9": new Button("L9", ["B", "c"], 2, "l2"),
        "L10": new Button("L10", ["d", "e"], 2, "l1"),

        // Middle row, RH
        "R1": new Button("R1", ["c", "B"], 1, "r1"),
        "R2": new Button("R2", ["e", "d"], 1, "r2"),
        "R3": new Button("R3", ["g", "f"], 2, "r3"),
        "R4": new Button("R4", ["c'", "a"], 2, "r4"),
        "R5": new Button("R5", ["e'", "b"], 2, "r4"),

        // Bottom row, RH
        "R6": new Button("R6", ["g", "^f"], 1, "r1"),
        "R7": new Button("R7", ["b", "a"], 1, "r2"),
        "R8": new Button("R8", ["d'", "c'"], 1, "r3"),
        "R9": new Button("R9", ["g'", "e'"], 1, "r4"),
        "R10": new Button("R10", ["b'", "^f'"], 1, "r4")

    };

    //
    // Cross-row map for Wheatstone
    //
    var baseMapCrossRowWheatstone = {

        // Top row, LH
        "L1a": new Button("L1a", ["E,", "F,"], 10, "l4"),
        "L2a": new Button("L2a", ["A,", "_B,"], 10, "l4"),
        "L3a": new Button("L3a", ["^C", "_E"], 10, "l3"),
        "L4a": new Button("L4a", ["A", "G"], 10, "l2"),
        "L5a": new Button("L5a", ["^G", "_B"], 10, "l1"),

        // Middle row, LH
        "L1": new Button("L1", ["C,", "G,"], 1, "l4"),
        "L2": new Button("L2", ["G,", "B,"], 1, "l4"),
        "L3": new Button("L3", ["C", "D"], 1, "l3"),
        "L4": new Button("L4", ["E", "F"], 1, "l2"),
        "L5": new Button("L5", ["G", "A"], 1, "l1"),

        // Bottom row, LH
        "L6": new Button("L6", ["B,", "A,"], 1, "l4"),
        "L7": new Button("L7", ["D", "^F"], 2, "l4"),
        "L8": new Button("L8", ["G", "A"], 2, "l3"),
        "L9": new Button("L9", ["B", "c"], 2, "l2"),
        "L10": new Button("L10", ["d", "e"], 1, "l1"),

        // Middle row, RH
        "R1": new Button("R1", ["c", "B"], 1, "r1"),
        "R2": new Button("R2", ["e", "d"], 2, "r2"),
        "R3": new Button("R3", ["g", "f"], 2, "r3"),
        "R4": new Button("R4", ["c'", "a"], 2, "r4"),
        "R5": new Button("R5", ["e'", "b"], 2, "r4"),

        // Bottom row, RH
        "R6": new Button("R6", ["g", "^f"], 1, "r1"),
        "R7": new Button("R7", ["b", "a"], 1, "r2"),
        "R8": new Button("R8", ["d'", "c'"], 1, "r3"),
        "R9": new Button("R9", ["g'", "e'"], 1, "r4"),
        "R10": new Button("R10", ["b'", "^f'"], 1, "r4")

    };

    //
    // My preferred fingering map for Cross-Row playing
    //
    var baseMapCrossRow = {

        // Top row, LH
        "L1a": new Button("L1a", ["E,", "F,"], 10, "l4"),
        "L2a": new Button("L2a", ["A,", "_B,"], 10, "l4"), 
        "L3a": new Button("L3a", ["^C", "_E"], 10, "l3"),
        "L4a": new Button("L4a", ["A", "G"], 10, "l2"),
        "L5a": new Button("L5a", ["^G", "_B"], 10, "l1"),

        // Middle row, LH
        "L1": new Button("L1", ["C,", "G,"], 1, "l4"),
        "L2": new Button("L2", ["G,", "B,"], 1, "l4"),
        "L3": new Button("L3", ["C", "D"], 1, "l3"),
        "L4": new Button("L4", ["E", "F"], 1, "l2"),
        "L5": new Button("L5", ["G", "A"], 1, "l1"),

        // Bottom row, LH
        "L6": new Button("L6", ["B,", "A,"], 1, "l4"), 
        "L7": new Button("L7", ["D", "^F"], 2, "l4"),
        "L8": new Button("L8", ["G", "A"], 2, "l3"),
        "L9": new Button("L9", ["B", "z"], 2, "l2"),
        "L9a": new Button("L9", ["z", "c"], 1, "l2"),
        "L10": new Button("L10", ["d", "e"], 1, "l1"),

        // Middle row, RH
        "R1": new Button("R1", ["c", "x"], 2, "r1"),
        "R1x": new Button("R1",["x", "B"], 1, "r1"),
        "R2": new Button("R2", ["e", "d"], 2, "r2"),
        "R3": new Button("R3", ["g", "f"], 2, "r3"),
        "R4": new Button("R4", ["c'", "a"], 2, "r4"),
        "R5": new Button("R5", ["e'", "b"], 2, "r4"),

        // Bottom row, RH
        "R6": new Button("R6", ["g", "^f"], 1, "r1"),
        "R7": new Button("R7", ["b", "a"], 1, "r2"),
        "R8": new Button("R8", ["d'", "c'"], 1, "r3"),
        "R9": new Button("R9", ["g'", "e'"], 1, "r4"),
        "R10": new Button("R10", ["b'", "^f'"], 1, "r4")

    };

    var jeffriesRxMapOriginal = {
        // Top row, RH
        "R1a": new Button("R1a", ["^d", "^c"], 1, "r1"),
        "R2a": new Button("R2a", ["^c", "^d"], 10, "r2"),
        "R3a": new Button("R3a", ["^g", "g"], 10, "r3"),
        "R4a": new Button("R4a", ["^c'", "_b"], 10, "r4"),
        "R5a": new Button("R5a", ["a", "d'"], 10, "r4")
    };

    // Prefers a R2a press C#
    var jeffriesRxMapAlt = {
        // Top row, RH
        "R1a": new Button("R1a", ["^d", "^c"], 10, "r1"),
        "R2a": new Button("R2a", ["^c", "^d"], 1, "r2"),
        "R3a": new Button("R3a", ["^g", "g"], 10, "r3"),
        "R4a": new Button("R4a", ["^c'", "_b"], 10, "r4"),
        "R5a": new Button("R5a", ["a", "d'"], 10, "r4")
    };

    var wheatstoneRxMapOriginal = {
        // Top row, RH
        "R1a": new Button("R1a", ["^c", "^d"], 10, "r1"),
        "R2a": new Button("R2a", ["a", "g"], 10, "r2"),
        "R3a": new Button("R3a", ["^g", "_b"], 10, "r3"),
        "R4a": new Button("R4a", ["^c'", "_e'"], 10, "r4"),
        "R5a": new Button("R5a", ["a'", "f'"], 10, "r4"),
    };

    var gAngloButtonNames_GaryCoover = [

        // Top row, LH
        "1a",
        "2a",
        "3a",
        "4a",
        "5a",

        // Top row, RH
        "1a",
        "2a",
        "3a",
        "4a",
        "5a",

        // Middle row, LH
        "1",
        "2",
        "3",
        "4",
        "5",

        // Middle row, RH
        "1",
        "2",
        "3",
        "4",
        "5",

        // Bottom row, LH
        "6",
        "7",
        "8",
        "9",
        "10",

        // Bottom row, RH
        "6",
        "7",
        "8",
        "9",
        "10"
    ];

    // Initialization of the original button map
    var jeffriesMap = null;
    var wheatstoneMap = null;
    var buttonToNoteMap = null;
    var buttonMapIndex = null;

    //
    // Process the button naming matrix at tab build time
    //
    function processButtonNoteNames(map){

        var originalButtonNames = gAngloButtonNames;

        if (gInjectTab_GaryCoover){
            gAngloButtonNames = gAngloButtonNames_GaryCoover;
        }

        // Top row
        map["L1a"].name = gAngloButtonNames[0];
        map["L2a"].name = gAngloButtonNames[1];
        map["L3a"].name = gAngloButtonNames[2];
        map["L4a"].name = gAngloButtonNames[3];
        map["L5a"].name = gAngloButtonNames[4];
        map["R1a"].name = gAngloButtonNames[5];
        map["R2a"].name = gAngloButtonNames[6];
        map["R3a"].name = gAngloButtonNames[7];
        map["R4a"].name = gAngloButtonNames[8];
        map["R5a"].name = gAngloButtonNames[9];

        // Middle row
        map["L1"].name = gAngloButtonNames[10];
        map["L2"].name = gAngloButtonNames[11];
        map["L3"].name = gAngloButtonNames[12];
        map["L4"].name = gAngloButtonNames[13];
        map["L5"].name = gAngloButtonNames[14];
        map["R1"].name = gAngloButtonNames[15];

        // Special case
        if (map["R1x"]){
            map["R1x"].name = gAngloButtonNames[15];
        }

        map["R2"].name = gAngloButtonNames[16];
        map["R3"].name = gAngloButtonNames[17];
        map["R4"].name = gAngloButtonNames[18];
        map["R5"].name = gAngloButtonNames[19];

        // Bottom row
        map["L6"].name = gAngloButtonNames[20];
        map["L7"].name = gAngloButtonNames[21];
        map["L8"].name = gAngloButtonNames[22];
        map["L9"].name = gAngloButtonNames[23];

         // Special case
        if (map["L9a"]){
            map["L9a"].name = gAngloButtonNames[23];
        }
       
        map["L10"].name = gAngloButtonNames[24];
        map["R6"].name = gAngloButtonNames[25];
        map["R7"].name = gAngloButtonNames[26];
        map["R8"].name = gAngloButtonNames[27];
        map["R9"].name = gAngloButtonNames[28];
        map["R10"].name = gAngloButtonNames[29];

        // Restore the original map
        if (gInjectTab_GaryCoover){
            gAngloButtonNames = originalButtonNames;
        }

        return map;
    }

    // 
    // Called at solution generation time
    //
    function setButtonToNoteMap() {

        var baseMapIndex = parseInt(gInjectTab_ConcertinaFingering);

        jeffriesMap = [];
        wheatstoneMap = [];

        switch (baseMapIndex) {

            // Original
            case 0:

                for (var x in jeffriesRxMapAlt) {
                    jeffriesMap[x] = jeffriesRxMapAlt[x];
                }

                for (var x in wheatstoneRxMapOriginal) {
                    wheatstoneMap[x] = wheatstoneRxMapOriginal[x];
                }

                for (var x in baseMapOriginal) {
                    jeffriesMap[x] = baseMapOriginal[x];
                    wheatstoneMap[x] = baseMapOriginal[x];
                }

                break;

            // Cross-row: original G-row draw C5 (1), or alternate C-row push C5 (2).
            case 1:
            case 2:

                for (var x in jeffriesRxMapAlt) {
                    jeffriesMap[x] = jeffriesRxMapAlt[x];
                }

                for (var x in wheatstoneRxMapOriginal) {
                    wheatstoneMap[x] = wheatstoneRxMapOriginal[x];
                }

                for (var x in baseMapCrossRow) {
                    jeffriesMap[x] = baseMapCrossRow[x];
                }

                for (var x in baseMapCrossRow) {
                      wheatstoneMap[x] = baseMapCrossRow[x];
                }

                if (baseMapIndex === 2) {
                    // Reverse ONLY the two C5 preference costs. All other
                    // cross-row button mappings and weights stay unchanged.
                    // L9a: left G-row draw C5; R1: right C-row push C5.
                    var leftC5 = baseMapCrossRow["L9a"];
                    var rightC5 = baseMapCrossRow["R1"];
                    jeffriesMap["L9a"] = new Button(leftC5.name, leftC5.notes, rightC5.cost, leftC5.finger);
                    jeffriesMap["R1"] = new Button(rightC5.name, rightC5.notes, leftC5.cost, rightC5.finger);
                    wheatstoneMap["L9a"] = new Button(leftC5.name, leftC5.notes, rightC5.cost, leftC5.finger);
                    wheatstoneMap["R1"] = new Button(rightC5.name, rightC5.notes, leftC5.cost, rightC5.finger);
                }

                break;
        }

        if (parseInt(gInjectTab_ConcertinaStyle) == 0){

            buttonToNoteMap = jeffriesMap;

        }
        else{

            buttonToNoteMap = wheatstoneMap;

        }

        // Inject custom button names
        buttonToNoteMap = processButtonNoteNames(buttonToNoteMap);

    }


    // Globals
    var keySignature = null;
    var bestCost;
    var bestPathFromState = null;
    var stateCount = 0;

    function angloLog(s) {
        if (gAngloVerbose)
            console.log(s);
    }

    function generateAngloFingerings(abcInput) {

        angloLog("Got input:" + abcInput);

        // Make sure the button note map is up to date
        setButtonToNoteMap();

        // Find the key signature in the input
        keySignature = findKeySignature(abcInput);

        if (keySignature == null) {
            return ("ERROR: Unknown or unsupported key signature");
        }

        // Generate an array of note objects. Each
        var notes = getAbcNotes(abcInput);

        // Generate the inverse mapping
        var noteToButtonMap = generateNoteToButtonMap(buttonToNoteMap);

        // Sort the inverse mapping table with the least costly buttons first.
        // This speeds up tree pruning later
        sortButtonMap(noteToButtonMap);

        // Generate a state tree
        var stateTree = generateStateTree(notes, noteToButtonMap);

        var path = chooseFingerings(stateTree);

        if (path != null) {
            // Preserve the original fingering path except at the two repeat boundaries.
            correctSecondEndingEntryFingerings(path, notes, noteToButtonMap);
            correctFirstEndingExitFingerings(path, notes, noteToButtonMap);
            correctStandardRepeatExitFingerings(path, notes, noteToButtonMap);
            correctTuneLoopExitFingering(path, notes, noteToButtonMap);
        }

        if (path == null) {
            angloLog("No fingerings generated!");
            return abcOutput;
        }

        // Merge the chosen fingerings with the ABC notation
        abcOutput = mergeFingerings(abcInput, path, notes);

        return abcOutput;

    }


    // Path constructor.
    var Path = function(states, cost) {
        this.states = states;
        this.cost = cost;
    };

    // Note constructor
    var Note = function(index, unNormalizedValue, normalizedValue) {
        this.index = index; // Index of this note in the original ABC input string
        this.unNormalizedValue = unNormalizedValue;
        this.normalizedValue = normalizedValue;
    };

    // State constructor
    var State = function(note, button, direction) {
        this.note = note;
        this.button = button;
        this.direction = direction;
        this.nextStates = [];
        this.id = stateCount++;

        this.toString = function() {
            var s = "[" + this.id + "] Note:";
            if (this.note) { s += this.note.normalizedValue; } else { s += "none"; }
            s += " Button:" + this.button.name;
            return s;
        };
    };


    // Determines the key signature
    function findKeySignature(abcInput) {

        var myMap = null;

        var keyMatch = abcInput.match(/^K: *([A-G])([b#])? *(.*?)$/m);
        if (keyMatch == null || keyMatch.length < 3) {
            return null;
        }

        var keySignatureBase;
        var keyExtra;

        if (keyMatch[2] == undefined) {
            keySignatureBase = keyMatch[1];
        } else {
            keySignatureBase = keyMatch[1] + keyMatch[2];
        }
        keyExtra = keyMatch[3].toLowerCase();

        // Strip any trailing comments
        var searchExp = /%.*/
        keyExtra = keyExtra.replace(searchExp,"");
        keyExtra = keyExtra.trim();

        angloLog("Got base key of '" + keySignatureBase + "' and extra of '" + keyExtra + "'");
        
        // Determine musical mode
        if (keyExtra == "" ||
            keyExtra.search("maj") != -1 ||
            keyExtra.search("ion") != -1) {
            angloLog("Mode: Ionian (major)");
            myMap = keySignatureMap(keySignatureBase, 0);
        } else if (keyExtra.search("mix") != -1) {
            angloLog("Mode: Mixolydian");
            myMap = keySignatureMap(keySignatureBase, 1);
        } else if (keyExtra.search("dor") != -1) {
            angloLog("Mode: Dorian");
            myMap = keySignatureMap(keySignatureBase, 2);
        } else if ((keyExtra.search("m") != -1 && keyExtra.search("mix") == -1) ||
            keyExtra.search("min") != -1 ||
            keyExtra.search("aeo") != -1) {
            angloLog("Mode: Aeolian (minor)");
            myMap = keySignatureMap(keySignatureBase, 3);
        } else if (keyExtra.search("phr") != -1) {
            angloLog("Mode: Phrygian");
            myMap = keySignatureMap(keySignatureBase, 4);
        } else if (keyExtra.search("loc") != -1) {
            angloLog("Mode: Locrian");
            myMap = keySignatureMap(keySignatureBase, 5);
        } else if (keyExtra.search("lyd") != -1) {
            angloLog("Mode: Lydian");
            myMap = keySignatureMap(keySignatureBase, -1);
        } else if (keyExtra.search("exp") != -1) {
            angloLog("(Accidentals to be explicitly specified)");
            myMap = keySignatureMap("C", 0);
        } else {
            // Unknown
            angloLog("Failed to determine key signature mode");
            myMap = null;
        }

        if (myMap == null) {
            return myMap;
        }

        //Handle explicit accidentals
        var explicitFlats = keyExtra.match(/_./g);
        var explicitSharps = keyExtra.match(/\^./g);

        for (note in explicitFlats) {
            myMap.flats += explicitFlats[note][1].toUpperCase();
        }

        for (note in explicitSharps) {
            myMap.sharps += explicitSharps[note][1].toUpperCase();
        }

        return myMap;

    }

    // Calculates a key signature map given a tonic and a mode
    function keySignatureMap(tonic, modeFlatness) {
        var circleOfFifths = "FCGDAEB";

        var signature = {
            sharps: "",
            flats: ""
        };

        var baseSharpness = circleOfFifths.indexOf(tonic[0]) - 1;

        if (baseSharpness == -2) {
            angloLog("Bad tonic: " + tonic);
            return null;
        }

        if (tonic.slice(1) == "b") {
            baseSharpness -= 7;
        } else if (tonic.slice(1) == "#") {
            baseSharpness += 7;
        }

        var totalSharpness = baseSharpness - modeFlatness;

        if (totalSharpness > 7) {
            angloLog("Too many sharps: " + totalSharpness);
            return null;
        } else if (totalSharpness < -7) {
            angloLog("Too many flats: " + (totalSharpness * -1));
            return null;
        } else if (totalSharpness > 0) {
            signature.sharps = circleOfFifths.slice(0, totalSharpness);
        } else if (totalSharpness < 0) {
            signature.flats = circleOfFifths.slice(totalSharpness);
        }

        signature.accidentalSharps = "";
        signature.accidentalFlats = "";
        signature.accidentalNaturals = "";

        return signature;
    }

    // Merges an array of Button objects with an array of Notes
    // with the original string input.
    // Returns a merged string.
    function mergeFingerings(input, path, notes) {

        // Drop the first state of the path - it's a dummy root state
        path.states.shift();

        if (path.states.length != notes.length) {
            return "ERROR: Internal error. Length mismatch";
        }

        var result = input;
        var insertedTotal = 0;

        var location = parseInt(gInjectTab_TabLocation);

        for (var i = 0; i < path.states.length; ++i) {

            var index = notes[i].index + insertedTotal;

            var fingering = path.states[i].button.name;

            // *** CHANGE: mark tune if we render an x or if direction is invalid
            const dir = path.states[i].direction;
            const hasValidDir = (dir === PUSH_NAME || dir === DRAW_NAME);

            if (fingering === "x" || !hasValidDir) {
                currentTuneHadX = true;
                let simpleX;
                switch (location) {
                    case 0: // Above
                        simpleX = "\"^x\"";
                        break;
                    case 1: // Below
                        simpleX = "\"_x\"";
                        break;
                    default:
                        simpleX = "\"^x\"";
                }
                result = result.substr(0, index) + simpleX + result.substr(index);
                insertedTotal += simpleX.length;
                continue;
            }

            if (gInjectTab_GaryCoover){

                var finger = path.states[i].button.finger;

                var isLeftSide = (finger.indexOf("l") == 0);

                // Left side is below the staff
                if (isLeftSide){

                    if (path.states[i].direction == PUSH_NAME){

                        // Add double quotes to fingering, to be rendered below the note
                        fingering = "\"_" + " " + ";" + fingering + "\"";

                    }
                    else{

                        var len = fingering.length;
                        var theBar = "";

                        for (var j=0;j<len;++j){
                            theBar += "_";
                        }

                        var origFingering = fingering;
                        fingering = "\"_" + theBar + ";";
                        fingering = fingering + origFingering + "\"";                       
                    }

                }
                else{

                    if (path.states[i].direction == PUSH_NAME){

                        // Add double quotes to fingering, to be rendered above the note
                        fingering = "\"^" + fingering + "\"";

                    }
                    else{

                        var len = fingering.length;
                        var theBar = "";

                        for (var j=0;j<len;++j){
                            theBar += "_";
                        }

                        var origFingering = fingering;
                        fingering = "\"^" + theBar + ";";
                        fingering = fingering + origFingering + "\"";
                       
                    }
                }
            }
            else{

                if (gInjectTab_UseBarForDraw){

                   switch (location){

                        // Above
                        case 0:

                            if (path.states[i].direction == PUSH_NAME){

                                // Add double quotes to fingering, to be rendered above the note
                                fingering = "\"^" + fingering + "\"";

                            }
                            else{

                                var len = fingering.length;
                                var theBar = "";

                                for (var j=0;j<len;++j){
                                    theBar += "_";
                                }

                                var origFingering = fingering;
                                fingering = "\"^" + theBar + ";";
                                fingering = fingering + origFingering + "\"";
                               
                            }

                            break;

                        // Below
                        case 1:

                           if (path.states[i].direction == PUSH_NAME){

                                // Add double quotes to fingering, to be rendered below the note
                                fingering = "\"_" + " " + ";" + fingering + "\"";

                            }
                            else{

                                var len = fingering.length;
                                var theBar = "";

                                for (var j=0;j<len;++j){
                                    theBar += "_";
                                }

                                var origFingering = fingering;
                                fingering = "\"_" + theBar + ";";
                                fingering = fingering + origFingering + "\"";
                               
                            }
     
                            break;

                    }
                }
                else{

                    switch (location){

                        // Above
                        case 0:

                            // Add double quotes to fingering, to be rendered above the note
                            fingering = "\"^" + fingering + ";";

                            // Optionally append bellows direction, to be rendered below the button number.
                            fingering = fingering + path.states[i].direction + "\"";

                            break;

                        // Below
                        case 1:

                            // Add double quotes to fingering, to be rendered below the note
                            fingering = "\"_" + fingering + ";";

                            // Optionally append bellows direction, to be rendered below the button number.
                            fingering = fingering + path.states[i].direction + "\"";

                            break;

                    }
                }
            }

            var fingLen = fingering.length;

            result = result.substr(0, index) + fingering + result.substr(index);

            insertedTotal += fingLen;
        }

        return result;
    }

    // Determines the bellows direction (PUSH/DRAW) given
    // a button and note.
    function findBellowsDirection(note, button) {

        if (note.normalizedValue == button.notes[PUSH_INDEX]) {

            return PUSH_NAME;

        } else if (note.normalizedValue == button.notes[DRAW_INDEX]) {

            return DRAW_NAME;

        } else {

            var respelled = respellNormalized(note.normalizedValue);

            if (respelled == button.notes[PUSH_INDEX]) {

                return PUSH_NAME;

            } else if (respelled == button.notes[DRAW_INDEX]) {

                return DRAW_NAME;

            } else {

                return " "; // Better than saying "null"

            }
        }
    }


    // Determines if these two buttons would be a hop if played back-to-back
    function isHop(button1, button2) {
        return (button1.finger == button2.finger && button1.name != button2.name);
    }


    // Generate a state tree from the notes.
    function generateStateTree(notes, noteToButtonMap) {

        var firstNoteStates = null;
        var lastNoteStates = null;

        for (var i = 0; i < notes.length; ++i) {
            var note = notes[i];

            var normalizedValue = note.normalizedValue;
            var buttons = noteToButtonMap[normalizedValue];

            if (buttons == null || buttons.length < 1) {
                angloLog("Failed to find button for note " + normalizedValue);
                angloLog("Attempting respell...");
                var otherName = respell(normalizedValue);
                angloLog("Respelled as " + otherName);
                buttons = noteToButtonMap[otherName];

                // *** CHANGE: if still not found, inject a fallback 'x' button and mark tune
                if (buttons == null || buttons.length < 1) {
                    angloLog("Respelling as " + otherName + " failed to find a button. Inserting fallback 'x'.");
                    const fallbackButton = new Button("x", [normalizedValue, normalizedValue], 0, "na");
                    buttons = [fallbackButton];
                    currentTuneHadX = true; // mark for this tune
                }
            }

            var states = [];
            // Create a state per button
            buttons.forEach(function(button) {
                states.push(new State(note, button, findBellowsDirection(note, button)));
            });

            if (firstNoteStates == null) {
                firstNoteStates = states;
            }
            if (lastNoteStates != null) {
                lastNoteStates.forEach(function(lastState) {
                    lastState.nextStates = states;
                });
            }
            lastNoteStates = states;
        }

        // Create a dummy state as our tree root
        var rootState = new State(null, new Button("root", [], 0, "none"));
        rootState.nextStates = firstNoteStates;
        return rootState;

    } // end generateStateTree



    // Chooses fingerings (wrapper)
    function chooseFingerings(stateTree) {
        bestCost = 100000000;
        bestPathFromState = {};
        return chooseFingeringsRecursive(stateTree);
    }

    // Choose best fingerings for current state.
    function chooseFingeringsRecursive(state) {

        if (state.nextStates.length == 0) {
            angloLog("Last state, note=" + state.note.normalizedValue + " button=" + state.button.name + ". Popping up the stack");
            return new Path([state], state.button.cost);
        }

        var note = state.note;
        var unNormalizedValue = null;
        var normalizedValue = null;
        if (note != null) {
            unNormalizedValue = note.unNormalizedValue;
            normalizedValue = note.normalizedValue;
        }

        angloLog("Choosing: current note=" + normalizedValue + " button=" + state.button.name);

        if (bestPathFromState[state]) {
            angloLog("Already visited state note=" + state.note.normalizedValue + " button=" + state.button.name);
            return bestPathFromState[state];
        }

        var bestPath = new Path([], 10000000);

        // Consider all the possible next states
        for (var i = 0; i < state.nextStates.length; ++i) {

            var nextState = state.nextStates[i];

            angloLog("Trying next [" + i + "/" + state.nextStates.length + "] note=" + nextState.note.normalizedValue + " button=" + nextState.button.name);

            // Recurse! Find the fingering for the rest of the tune.
            var path = chooseFingeringsRecursive(nextState);
            if (path == null) {
                angloLog("Could not get fingerings");
                return null;
            }

            var myCost = state.button.cost;
            var HOP_COST = 100;

            if (path.states.length != 0) {
                var nextButton = path.states[0].button;

                if (isHop(state.button, nextButton)) {
                    angloLog("Penalizing finger hop for note " + normalizedValue);
                    myCost += HOP_COST;
                }
            }

            angloLog("path had cost of " + path.cost + " my cost=" + myCost);
            if (path.cost + myCost < bestPath.cost) {
                var newStateList = path.states.slice(0);
                newStateList.unshift(state);
                bestPath = new Path(newStateList, path.cost + myCost);
                angloLog("New best path for note[" + normalizedValue + "], cost=" + bestPath.cost);
            }

        } // end for nextState

        bestPathFromState[state] = bestPath;

        angloLog("Done choosing: current note=" + normalizedValue + " button=" + state.button.name + " best cost=" + bestPath.cost);

        return bestPath;

    } // end chooseFingeringsRecursive

    // A second ending is played after the common bar BEFORE the first ending,
    // not after the final note of the first ending as in the printed ABC order.
    // Apply this correction only to its first note. In particular, do not
    // re-optimize the rest of the tune or modify the normal cost/tie rules.
    function correctSecondEndingEntryFingerings(path, notes, noteToButtonMap) {
        var entries = notes.secondEndingEntries || [];
        for (var e = 0; e < entries.length; ++e) {
            var pair = entries[e];
            var entryState = path.states[pair.entryNoteIndex + 1]; // root at 0
            var beforeFirst = path.states[pair.beforeFirstNoteIndex + 1];
            var afterEntry = path.states[pair.entryNoteIndex + 2];
            if (!entryState || !beforeFirst) continue;

            var entryNote = notes[pair.entryNoteIndex];
            var buttons = noteToButtonMap[entryNote.normalizedValue];
            if (!buttons || !buttons.length) {
                buttons = noteToButtonMap[respell(entryNote.normalizedValue)];
            }
            if (!buttons || !buttons.length) continue;

            // Match the original solver's button cost and 100-point finger-hop
            // penalty, but use the *played* predecessor at this one entry.
            // Preserve the original button when costs are equal.
            var localCost = function (button) {
                return button.cost +
                    (isHop(beforeFirst.button, button) ? 100 : 0) +
                    (afterEntry && isHop(button, afterEntry.button) ? 100 : 0);
            };
            var chosen = entryState.button;
            var chosenCost = localCost(chosen);
            for (var b = 0; b < buttons.length; ++b) {
                var button = buttons[b];
                var candidateCost = localCost(button);
                if (candidateCost < chosenCost) {
                    chosen = button;
                    chosenCost = candidateCost;
                }
            }
            if (chosen !== entryState.button) {
                entryState.button = chosen;
                entryState.direction = findBellowsDirection(entryNote, chosen);
            }
        }
    }

    // On the first pass, a first ending leads back to the opening repeat.
    // Correct only that ending's LAST note: the normal written-order solver
    // mistakenly considers the first note of the second ending its successor.
    // Keep the previous note, button costs, hop penalty and original tie choice.
    function correctFirstEndingExitFingerings(path, notes, noteToButtonMap) {
        var entries = notes.secondEndingEntries || [];
        for (var e = 0; e < entries.length; ++e) {
            var pair = entries[e];
            if (pair.firstEndingLastNoteIndex == null ||
                pair.repeatStartNoteIndex == null) continue;

            var exitIndex = pair.firstEndingLastNoteIndex;
            var exitState = path.states[exitIndex + 1]; // dummy root at 0
            var previous = path.states[exitIndex];
            var repeatStart = path.states[pair.repeatStartNoteIndex + 1];
            if (!exitState || !previous || !repeatStart) continue;

            var exitNote = notes[exitIndex];
            var buttons = noteToButtonMap[exitNote.normalizedValue];
            if (!buttons || !buttons.length) {
                buttons = noteToButtonMap[respell(exitNote.normalizedValue)];
            }
            if (!buttons || !buttons.length) continue;

            var localCost = function (button) {
                return button.cost +
                    (isHop(previous.button, button) ? 100 : 0) +
                    (isHop(button, repeatStart.button) ? 100 : 0);
            };
            var chosen = exitState.button;
            var chosenCost = localCost(chosen);
            for (var b = 0; b < buttons.length; ++b) {
                var button = buttons[b];
                var candidateCost = localCost(button);
                if (candidateCost < chosenCost) {
                    chosen = button;
                    chosenCost = candidateCost;
                }
            }
            if (chosen !== exitState.button) {
                exitState.button = chosen;
                exitState.direction = findBellowsDirection(exitNote, chosen);
            }
        }
    }

    // When the entire tune is played again, its final note leads directly
    // back to the FIRST note, including when the tune ends in a second ending.
    // Leave every other selected fingering unchanged, and keep original ties.
    // A written repeat-close (:|) has TWO played exits: back to its matched
    // repeat opening on the first pass, then onward on the subsequent pass.
    // This targeted pass adjusts only the note immediately before :|.
    // First endings remain under the dedicated first-ending correction; the
    // following [2 note is not their played successor on the first pass.
    function correctStandardRepeatExitFingerings(path, notes, noteToButtonMap) {
        var exits = notes.standardRepeatExits || [];
        var pairs = notes.secondEndingEntries || [];
        for (var e = 0; e < exits.length; ++e) {
            var exit = exits[e];
            var index = exit.exitNoteIndex;
            if (index < 0 || index >= notes.length) continue;
            // Keep the established first-ending patch in sole control of these notes.
            var isFirstEndingExit = pairs.some(function(pair) {
                return pair.firstEndingLastNoteIndex === index;
            });
            if (isFirstEndingExit) continue;

            var exitState = path.states[index + 1];
            var repeatState = path.states[exit.repeatStartNoteIndex + 1];
            var nextState = exit.nextNoteIndex < notes.length ? path.states[exit.nextNoteIndex + 1] : null;
            if (!nextState && index === notes.length - 1) nextState = path.states[1];
            var previous = index > 0 ? path.states[index] : null;
            // A one-note second ending skips the intervening first-ending notes.
            for (var p = 0; p < pairs.length; ++p) {
                if (pairs[p].entryNoteIndex === index) {
                    previous = path.states[pairs[p].beforeFirstNoteIndex + 1];
                    break;
                }
            }
            if (!exitState || !repeatState || !previous) continue;
            var note = notes[index];
            var buttons = noteToButtonMap[note.normalizedValue];
            if (!buttons || !buttons.length) buttons = noteToButtonMap[respell(note.normalizedValue)];
            if (!buttons || !buttons.length) continue;

            // A final :| can lead either into its section repeat or into the
            // start of the entire tune. If no button avoids both finger hops,
            // explicitly prefer the section-repeat transition.
            var finalRepeat = index === notes.length - 1;
            var allowsBoth = false;
            for (var b = 0; b < buttons.length; ++b) {
                if (!isHop(buttons[b], repeatState.button) &&
                    (!nextState || !isHop(buttons[b], nextState.button))) {
                    allowsBoth = true;
                    break;
                }
            }
            var localCost = function(button) {
                var predecessorHop = isHop(previous.button, button) ? 100 : 0;
                var repeatHop = isHop(button, repeatState.button) ? 100 : 0;
                var continuationHop = nextState && isHop(button, nextState.button) ? 100 : 0;
                if (finalRepeat && !allowsBoth) {
                    // Repeat jump wins only when both successor paths cannot be smooth.
                    return repeatHop * 1000 + button.cost + predecessorHop + continuationHop;
                }
                return button.cost + predecessorHop + repeatHop + continuationHop;
            };
            var chosen = exitState.button;
            var bestCost = localCost(chosen);
            for (var c = 0; c < buttons.length; ++c) {
                var candidate = buttons[c];
                var candidateCost = localCost(candidate);
                if (candidateCost < bestCost) {
                    chosen = candidate;
                    bestCost = candidateCost;
                }
            }
            if (chosen !== exitState.button) {
                exitState.button = chosen;
                exitState.direction = findBellowsDirection(note, chosen);
            }
        }
    }

    function correctTuneLoopExitFingering(path, notes, noteToButtonMap) {
        if (notes.length < 2) return;

        var lastIndex = notes.length - 1;
        // If the tune itself ends at :|, the repeat-aware correction has
        // already evaluated both the section restart and tune restart.
        if ((notes.standardRepeatExits || []).some(function(exit) {
            return exit.exitNoteIndex === lastIndex;
        })) return;
        var finalState = path.states[lastIndex + 1]; // dummy root at 0
        var previous = path.states[lastIndex];
        var firstState = path.states[1];

        // If the final note is ALSO the first note of a second ending,
        // the first ending is skipped on that pass. Its actual predecessor
        // is the common note immediately BEFORE the first ending.
        // Otherwise keep the immediate written predecessor unchanged.
        var entries = notes.secondEndingEntries || [];
        for (var e = 0; e < entries.length; ++e) {
            if (entries[e].entryNoteIndex === lastIndex) {
                var precedingIndex = entries[e].beforeFirstNoteIndex;
                if (precedingIndex >= 0 && precedingIndex < lastIndex) {
                    previous = path.states[precedingIndex + 1];
                }
                break;
            }
        }
        if (!finalState || !previous || !firstState) return;

        var finalNote = notes[lastIndex];
        var buttons = noteToButtonMap[finalNote.normalizedValue];
        if (!buttons || !buttons.length) {
            buttons = noteToButtonMap[respell(finalNote.normalizedValue)];
        }
        if (!buttons || !buttons.length) return;

        // Use the existing button cost and 100-point same-finger hop cost.
        // Only the final note is reconsidered, retaining the original
        // selection when there is no strictly lower-cost alternative.
        var localCost = function (button) {
            return button.cost +
                (isHop(previous.button, button) ? 100 : 0) +
                (isHop(button, firstState.button) ? 100 : 0);
        };
        var chosen = finalState.button;
        var chosenCost = localCost(chosen);
        for (var b = 0; b < buttons.length; ++b) {
            var candidate = buttons[b];
            var candidateCost = localCost(candidate);
            if (candidateCost < chosenCost) {
                chosen = candidate;
                chosenCost = candidateCost;
            }
        }
        if (chosen !== finalState.button) {
            finalState.button = chosen;
            finalState.direction = findBellowsDirection(finalNote, chosen);
        }
    }

    // Replaces parts of the given string with '*'
    function sanitizeString(input, start, len) {
        var s = "";
        for (var i = 0; i < len; ++i) { s += "*"; }
        return input.substr(0, start) + s + input.substr(start + len);
    }

    // Returns an array of Notes from the ABC string input
    function getAbcNotes(input) {

        var sanitizedInput = input;
        var headerRegex = /^\w:.*$/mg;
        var x;
        while (x = headerRegex.exec(input)) {
            sanitizedInput = sanitizeString(sanitizedInput, x.index, x[0].length);
        }

        // Sanitize chord markings
        var searchRegExp = /"[^"]*"/gm
        while (m = searchRegExp.exec(sanitizedInput)) {
            var start = m.index;
            var end = start + m[0].length;
            for (var index=start;index<end;++index){
                sanitizedInput = sanitizedInput.substring(0, index) + '*' + sanitizedInput.substring(index + 1);
            }
        }

        // Sanitize in-abc chords in brackets
        searchRegExp = /\[[^\]|]*\]/g
        while (m = searchRegExp.exec(sanitizedInput)) {
            var start = m.index;
            var end = start + m[0].length;
            for (var index=start;index<end;++index){
                sanitizedInput = sanitizedInput.substring(0, index) + '*' + sanitizedInput.substring(index + 1);
            }
        }  

        // Sanitize !*! style annotations
        searchRegExp = /![^!\n]*!/gm 
        while (m = searchRegExp.exec(sanitizedInput)) {
            var start = m.index;
            var end = start + m[0].length;
            for (var index=start;index<end;++index){
                sanitizedInput = sanitizedInput.substring(0, index) + '*' + sanitizedInput.substring(index + 1);
            }
        }

        // Sanitize multi-line comments
        searchRegExp = /^%%begintext((.|\n)*)%%endtext/gm
        while (m = searchRegExp.exec(sanitizedInput)) {
            var start = m.index;
            var end = start + m[0].length;
            for (var index=start;index<end;++index){
                sanitizedInput = sanitizedInput.substring(0, index) + '*' + sanitizedInput.substring(index + 1);
            }
        }  

        // Sanitize comments
        searchRegExp = /^%.*$/gm
        while (m = searchRegExp.exec(sanitizedInput)) {
            var start = m.index;
            var end = start + m[0].length;
            for (var index=start;index<end;++index){
                sanitizedInput = sanitizedInput.substring(0, index) + '*' + sanitizedInput.substring(index + 1);
            }
        }    

        // Sanitize !
        sanitizedInput = sanitizedInput.replaceAll("!","*");

        angloLog("orginal input:\n" + input);
        angloLog("sanitized input:\n" + sanitizedInput);

        // Find all the notes
        var regex = /([=^_]?[a-gA-G][',]?|\|)/g;
        var notes = [];
        var m;
        while (m = regex.exec(sanitizedInput)) {
            var unNormalizedValue = m[1];
            if (unNormalizedValue == "|") {
                keySignature.accidentalFlats = "";
                keySignature.accidentalSharps = "";
                keySignature.accidentalNaturals = "";
            } else {
                var normalizedValue = normalize(unNormalizedValue);
                angloLog("UnNormalized=" + unNormalizedValue + " normalized=" + normalizedValue);
                notes.push(new Note((m.index), unNormalizedValue, normalizedValue));
            }
        }

        // Record only simple, paired [1 / [2 or |1 / |2 endings. The
        // sanitized text excludes headers, quoted chords, and annotations,
        // while all indexes still refer to the original input.
        var endingMarkers = /(?:\[\s*([12])|\|\s*([12]))(?![0-9,\-])/g;
        var pendingFirst = -1;
        var entries = [];
        while (m = endingMarkers.exec(sanitizedInput)) {
            var number = m[1] || m[2];
            if (number == '1') {
                pendingFirst = m.index;
            } else if (pendingFirst >= 0) {
                var beforeFirst = -1;
                var firstSecondNote = -1;
                for (var n = 0; n < notes.length; ++n) {
                    if (notes[n].index < pendingFirst) beforeFirst = n;
                    if (firstSecondNote < 0 && notes[n].index >= m.index + m[0].length) {
                        firstSecondNote = n;
                    }
                }
                if (beforeFirst >= 0 && firstSecondNote >= 0) {
                    var pair = { beforeFirstNoteIndex: beforeFirst,
                                 entryNoteIndex: firstSecondNote };

                    // Only identify an exit when this first ending is followed
                    // by a repeat-close (:|). Find its matching explicit |:
                    // opener after any earlier :|, so a different tune part's
                    // repeat cannot accidentally become the target.
                    var between = sanitizedInput.slice(pendingFirst, m.index + m[0].length);
                    if (/:\|/.test(between)) {
                        var latestClose = -1;
                        var closing = /:\|/g;
                        var match;
                        while ((match = closing.exec(sanitizedInput.slice(0, pendingFirst))) !== null) {
                            latestClose = match.index;
                        }
                        var latestOpen = -1;
                        var opening = /\|:/g;
                        while ((match = opening.exec(sanitizedInput.slice(0, pendingFirst))) !== null) {
                            if (match.index > latestClose) latestOpen = match.index;
                        }
                        // If this is the first repeated section and no |:
                        // is written, ABC uses the beginning of the music as
                        // an implicit repeat start.
                        if (latestOpen >= 0 || latestClose < 0) {
                            var repeatStartNote = latestOpen < 0 ? 0 : -1;
                            var firstEndingLastNote = -1;
                            for (var k = 0; k < notes.length; ++k) {
                                if (latestOpen >= 0 && repeatStartNote < 0 &&
                                    notes[k].index >= latestOpen + 2 &&
                                    notes[k].index < pendingFirst) repeatStartNote = k;
                                if (notes[k].index >= pendingFirst && notes[k].index < m.index)
                                    firstEndingLastNote = k;
                            }
                            if (repeatStartNote >= 0 && firstEndingLastNote >= 0 &&
                                firstEndingLastNote > beforeFirst) {
                                pair.repeatStartNoteIndex = repeatStartNote;
                                pair.firstEndingLastNoteIndex = firstEndingLastNote;
                            }
                        }
                    }
                    entries.push(pair);
                }
                pendingFirst = -1;
            }
        }
        notes.secondEndingEntries = entries;
        // Pair explicit |: / :| repeat markers, including :|: and implicit
        // beginnings of a repeated part. Track actual closing-note locations;
        // do not treat barlines inside annotations, headers, or comments as repeats.
        var repeatExits = [];
        var repeatOpenStack = [];
        var repeatPartStart = 0;
        var repeatMarkers = /:\|:|\|:|:\|/g;
        while (m = repeatMarkers.exec(sanitizedInput)) {
            var token = m[0];
            var markerIndex = m.index;
            if (token === '|:') {
                repeatOpenStack.push(markerIndex + token.length);
                continue;
            }
            var exitNoteIndex = -1;
            var nextNoteIndex = notes.length;
            for (var r = 0; r < notes.length; ++r) {
                if (notes[r].index < markerIndex) exitNoteIndex = r;
                else { nextNoteIndex = r; break; }
            }
            var openIndex = repeatOpenStack.length ? repeatOpenStack.pop() : repeatPartStart;
            var repeatStartNoteIndex = -1;
            for (var s = 0; s < notes.length; ++s) {
                if (notes[s].index >= openIndex && notes[s].index < markerIndex) {
                    repeatStartNoteIndex = s;
                    break;
                }
            }
            if (repeatStartNoteIndex >= 0 && exitNoteIndex >= repeatStartNoteIndex) {
                repeatExits.push({ exitNoteIndex: exitNoteIndex,
                    repeatStartNoteIndex: repeatStartNoteIndex,
                    nextNoteIndex: nextNoteIndex });
            }
            repeatPartStart = markerIndex + (token === ':|:' ? 3 : 2);
            if (token === ':|:') repeatOpenStack.push(repeatPartStart);
        }
        notes.standardRepeatExits = repeatExits;

        return notes;
    }

    function respell(note) {
        var respellings = {
            "_A": "^G",
            "^A": "_B",
            "_D": "^C",
            "^D": "_E",
            "_E": "^D",
            "_G": "^F",
            "_F": "E",
            "^E": "F"
        };

        for (var x in respellings) {
            if (note.includes(x)) {
                return note.replace(x, respellings[x]);
            }
            if (note.includes(x.toLowerCase())) {
                return note.replace(x.toLowerCase(), respellings[x].toLowerCase());
            }
        }

        // no replacement performed
        return note;
    }

    function respellNormalized(note) {
        var ret = note;

        var respellings = {
            "_A": "^G",
            "^A": "_B",
            "_D": "^C",
            "^D": "_E",
            "_E": "^D", 
            "_G": "^F",
            "_F": "E",
            "^E": "F"
        };

        for (var x in respellings) {
            if (ret.includes(x)) {
                return ret.replace(x, respellings[x]);
            }
            if (ret.includes(x.toLowerCase())) {
                return ret.replace(x.toLowerCase(), respellings[x].toLowerCase());
            }
        }

        // No replacements performed
        return ret;
    }

    // Normalizes the given note string, given the key signature.
    function normalize(value) {

        var i = value.search(/[A-G]/i);
        if (i == -1) {
            angloLog("Failed to find basename for value!");
            return value;
        }
        var baseName = value.substr(i, 1).toUpperCase();

        // Does it have a natural?
        if (value.substr(0, 1) == "=") {
            keySignature.accidentalFlats = keySignature.accidentalFlats.replace(baseName, "");
            keySignature.accidentalSharps = keySignature.accidentalSharps.replace(baseName, "");
            keySignature.accidentalNaturals += baseName;
            return value.substr(1);
        }

        // Does it already have an accidental?
        if (value.substr(0, 1) == "_") {
            keySignature.accidentalFlats += baseName;
            keySignature.accidentalSharps = keySignature.accidentalSharps.replace(baseName, "");
            keySignature.accidentalNaturals = keySignature.accidentalNaturals.replace(baseName, "");
            return value;
        }

        if (value.substr(0, 1) == "^") {
            keySignature.accidentalFlats = keySignature.accidentalFlats.replace(baseName, "");
            keySignature.accidentalNaturals = keySignature.accidentalNaturals.replace(baseName, "");
            keySignature.accidentalSharps += baseName;
            return value;
        }

        // Transform to key signature
        if (keySignature.accidentalNaturals.search(baseName) != -1) {
            return value;
        }

        if (keySignature.sharps.search(baseName) != -1 ||
            keySignature.accidentalSharps.search(baseName) != -1) {
            return "^" + value;
        }

        if (keySignature.flats.search(baseName) != -1 ||
            keySignature.accidentalFlats.search(baseName) != -1) {
            return "_" + value;
        }

        return value;
    }

    // Sorts the button entries in the given note->button map, with lowest cost first
    function sortButtonMap(noteToButtonMap) {
        for (var note in noteToButtonMap) {
            var buttons = noteToButtonMap[note];
            buttons.sort(function(a, b) { return a.cost - b.cost; });
        }
    }

    // Given a button->note map, generate the corresponding note->button map.
    function generateNoteToButtonMap(buttonToNoteMap) {

        var noteMap = {};

        for (var buttonName in buttonToNoteMap) {

            var notes = buttonToNoteMap[buttonName].notes;

            if (notes == null) {
                angloLog("Failed to find entry for button " + b);
                continue;
            }

            notes.forEach(function(v) {

                if (noteMap[v] == null) {
                    noteMap[v] = [buttonToNoteMap[buttonName]];
                } else {
                    noteMap[v].push(buttonToNoteMap[buttonName]);
                }

                v = respell(v);

                if (noteMap[v] == null) {
                    noteMap[v] = [buttonToNoteMap[buttonName]];
                } else {
                    noteMap[v].push(buttonToNoteMap[buttonName]);
                }

            });

        }

        return noteMap;
    }

    //
    // Count the tunes in the text area
    //
    function angloCountTunes(theABC) {
        var theNotes = theABC;
        var theTunes = theNotes.split(/^X:.*$/gm);
        var nTunes = theTunes.length - 1;
        return nTunes;
    }

    // Glyphs for bellows push and draw indications
    var PUSH_NAME = "↓";
    var DRAW_NAME = "↑";

    //
    // Generate Anglo Concertina Tablature
    window.solveAngloTune = function(abc, system, fingeringStyle) {
        gInjectTab_ConcertinaStyle = system === "wheatstone" ? 1 : 0;
        gInjectTab_ConcertinaFingering = fingeringStyle === "cross-cpush" ? 2 : (fingeringStyle === "cross" ? 1 : 0);
        PUSH_NAME = "push";
        DRAW_NAME = "draw";
        setButtonToNoteMap();
        keySignature = findKeySignature(abc);
        if (keySignature == null) throw new Error("Unknown or unsupported key signature.");
        var notes = getAbcNotes(abc);
        var noteToButtonMap = generateNoteToButtonMap(buttonToNoteMap);
        sortButtonMap(noteToButtonMap);
        var stateTree = generateStateTree(notes, noteToButtonMap);
        var path = chooseFingerings(stateTree);

        if (path != null) {
            // Preserve the original fingering path except at the two repeat boundaries.
            correctSecondEndingEntryFingerings(path, notes, noteToButtonMap);
            correctFirstEndingExitFingerings(path, notes, noteToButtonMap);
            correctStandardRepeatExitFingerings(path, notes, noteToButtonMap);
            correctTuneLoopExitFingering(path, notes, noteToButtonMap);
        }
        if (!path) throw new Error("No fingering solution could be generated.");
        var states = path.states.slice(1);
        if (states.length !== notes.length) throw new Error("Internal fingering length mismatch.");
        return states.map(function(state, i) {
            return {
                index: i + 1,
                abcIndex: notes[i].index,
                abcNote: notes[i].unNormalizedValue,
                normalizedNote: notes[i].normalizedValue,
                button: state.button.name,
                direction: state.direction
            };
        });
    };
    return window.solveAngloTune(theABC, gInjectTab_ConcertinaStyle ? "wheatstone" : "jeffries",
        gInjectTab_ConcertinaFingering === 2 ? "cross-cpush" : (gInjectTab_ConcertinaFingering === 1 ? "cross" : "onrow"));
};

function abcPitchToMidi(s){
  if(!s||s==="x"||s==="z")return null;
  const m=String(s).match(/^([_=^]*)([A-Ga-g])([,']*)$/);if(!m)return null;
  const acc=m[1],letter=m[2],marks=m[3];let octave=letter===letter.toLowerCase()?5:4;
  for(const ch of marks)octave+=ch==="'"?1:-1;
  const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[letter.toUpperCase()];
  let delta=0;for(const ch of acc){if(ch==="^")delta++;else if(ch==="_")delta--;else if(ch==="=")delta=0}
  return 12*(octave+1)+pc+delta;
}

// Choose enharmonic spelling from this tune's K: field only, matching the player.
function keyTagPrefersFlats(abc){
  const m=String(abc||"").match(/^K:[ \t]*([A-Ga-g])([#b]?)([^\r\n]*)$/m);
  if(!m)return false;
  const tonic=m[1].toUpperCase()+m[2];
  const rest=String(m[3]||"").trim().toLowerCase();
  const modeToken=(rest.match(/^([a-z]+)/)||["",""])[1];
  let mode="major";
  if(modeToken==="m"||modeToken.startsWith("min")||modeToken.startsWith("aeo"))mode="minor";
  else if(modeToken.startsWith("dor"))mode="dorian";
  else if(modeToken.startsWith("mix"))mode="mixolydian";
  else if(modeToken===""||modeToken.startsWith("maj")||modeToken.startsWith("ion"))mode="major";
  const majorFifths={"Cb":-7,"Gb":-6,"Db":-5,"Ab":-4,"Eb":-3,"Bb":-2,"F":-1,"C":0,"G":1,"D":2,"A":3,"E":4,"B":5,"F#":6,"C#":7};
  if(!(tonic in majorFifths))return false;
  const modalOffset={major:0,mixolydian:-1,dorian:-2,minor:-3}[mode]??0;
  return majorFifths[tonic]+modalOffset<0;
}
function displayPitchClassName(midi,abc){
  const n=Math.round(Number(midi));if(!Number.isFinite(n))return "";
  const sharpNames=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const flatNames=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  return (keyTagPrefersFlats(abc)?flatNames:sharpNames)[(n%12+12)%12];
}
function displayStaffSpelling(midi,abc){
  const n=Math.round(Number(midi)),pc=((n%12)+12)%12;
  const sharp={0:["C",0],1:["C",1],2:["D",0],3:["D",1],4:["E",0],5:["F",0],6:["F",1],7:["G",0],8:["G",1],9:["A",0],10:["A",1],11:["B",0]};
  const flat={0:["C",0],1:["D",-1],2:["D",0],3:["E",-1],4:["E",0],5:["F",0],6:["G",-1],7:["G",0],8:["A",-1],9:["A",0],10:["B",-1],11:["B",0]};

function abcPitchToScientific(s,abc,useGlyphs=false){

  let name=displayPitchClassName(midi,abc);
  if(useGlyphs)name=name.replace(/#/g,"♯").replace(/b/g,"♭");

}

// Match the Anglo Concertina Fingering Player's ABC-style octave notation.

function midiToDisplayNoteName(midi,abc){

  const suffix=octave===1?",,,":octave===2?",,":octave===3?",":octave===4?"":octave===5?"'":octave===6?"''":octave===7?"'''":"";

}

function stripChordSymbols(abc) {
  // Strip quoted ABC chord symbols/annotations before the Anglo solver sees the tune.
  // Preserve string length so source note indices remain stable if they are ever used.
  return abc.replace(/"[^"\r\n]*"/g, function(m) { return " ".repeat(m.length); });

function splitTunes(abc) {
  const lines = abc.replace(/\r\n?/g,"\n").split("\n");
  const tunes = [];
  let pre = [], cur = null;
  for (const line of lines) {
    if (/^X\s*:/.test(line)) {
      if (cur) tunes.push(cur.join("\n").trim());
      cur = [...pre, line];
      pre = [];
    } else if (cur) cur.push(line);
    else pre.push(line);
  }
  if (cur) tunes.push(cur.join("\n").trim());
  if (!tunes.length && abc.trim()) tunes.push(abc.trim());
  return tunes.filter(Boolean);
}

// Only count tunes with a key declaration and at least one music note.
// Ignore metadata, comments, quoted chords, and decoration text while checking.
function validTunes(abc) {
  return splitTunes(abc).filter(tune => {
    const lines=tune.replace(/\r\n?/g,"\n").split("\n");
    const keyIndex=lines.findIndex(line=>/^K\s*:\s*[A-G](?:b|#)?(?:(?:maj|minor|min|m|dor|mix|aeo|ion|phr|lyd|loc|exp)[a-z]*|\s|$)/i.test(line));
    if(keyIndex<0)return false;
    const music=lines.slice(keyIndex+1).filter(line=>
      !/^\s*(?:%|[A-Za-z]:|$)/.test(line)
    ).join("\n")
      .replace(/%[^\n]*/g,"")
      .replace(/"[^"\n]*"/g,"")
      .replace(/![^!\n]*!/g,"")
      .replace(/\[[^\]\n|]*\]/g,"");
    return /(?:[=^_]?[A-Ga-g][,']*)/.test(music);
  });
}

    if(comment){if(ch==='\n'||ch==='\r')comment=false;continue}
    if(!quoted && ch==='%'){comment=true;continue}
    if(ch==='"'){quoted=!quoted;continue}
    if(quoted)continue;
    if(ch==='!'){decorated=!decorated;continue}
    if(decorated)continue;
    // Inline ABC fields (such as [K:G]) are not ending markers.
    if(ch==='[' && /^\[[A-Za-z]:/.test(abc.slice(i))){
      const close=abc.indexOf(']',i+1);if(close>=0){i=close;continue}
    }
    const rest=abc.slice(i);
    let m;
    if((m=rest.match(/^:\|(?:\s*\[?([12]))?/))){
      tokens.push({type:'end',pos:i});
      if(m[1])tokens.push({type:m[1]==='1'?'first':'second',pos:i+2});
      i+=m[0].length-1;continue;
    }
    if(rest.startsWith('|:')){tokens.push({type:'start',pos:i});i++;continue}
    if(rest.startsWith('::')){tokens.push({type:'end',pos:i},{type:'start',pos:i+1});i++;continue}
    if((m=rest.match(/^(?:\[|\|)([12])(?=\s|[A-Ga-g_^=zZxX]|$)/))){
      tokens.push({type:m[1]==='1'?'first':'second',pos:i});i+=m[0].length-1;continue;
    }
    if(rest.startsWith('||')||rest.startsWith('[|')||rest.startsWith('|]')){
      tokens.push({type:'double',pos:i,endPos:i+2});i++;continue;
    }
  }
  return tokens;
}

// Label written notes by structural part, keeping alternate endings in the
// preceding part. A repeated A section followed by B starts B at its next note.
function identifyWrittenParts(abc, solution) {
  const tokens=repeatControlTokens(abc), boundaries=[];
  let inEnding=false, afterFirst=false, pendingRepeatEnd=false;
  for(let i=0;i<tokens.length;i++){
    const t=tokens[i],next=tokens[i+1];
    if(t.type==='first'){inEnding=true;afterFirst=true;continue}
    if(t.type==='second'){inEnding=true;afterFirst=false;continue}
    if(t.type==='end'){
      // A first-ending :| is a playback jump, not a part boundary.
      if(afterFirst){pendingRepeatEnd=true;continue}
      boundaries.push(t.pos+2);inEnding=false;afterFirst=false;pendingRepeatEnd=false;
      continue;
    }
    if(t.type==='double'){
      if(afterFirst)continue;
      boundaries.push(t.endPos);inEnding=false;afterFirst=false;pendingRepeatEnd=false;
      continue;
    }
    if(t.type==='start'){
      // A new explicit repeat following a second ending begins a new part.
      if(inEnding || pendingRepeatEnd)boundaries.push(t.pos);
      inEnding=false;afterFirst=false;pendingRepeatEnd=false;
    }
  }
  const positions=[...new Set(boundaries)].sort((x,y)=>x-y);
  let part=0;
  for(const item of solution){
    while(part<positions.length && item.abcIndex>=positions[part])part++;
    item.writtenPart=part;
  }
  // Empty structural sections do not consume a part letter.
  const actual=[...new Set(solution.map(x=>x.writtenPart))];
  const remap=new Map(actual.map((p,i)=>[p,i]));
  for(const item of solution)item.writtenPart=remap.get(item.writtenPart);
  return solution;
}
function partLetter(index){
  let s="";do{s=String.fromCharCode(65+index%26)+s;index=Math.floor(index/26)-1}while(index>=0);
  return s;
}
function labelPartOccurrences(solution){
  // Each pass has its own note sequence. Excluded alternate endings do not
  // contribute to the numerator or denominator for that pass.
  const groups=new Map();
  const occurrence=new Map();
  let previousPart=null, previousPass=null, currentGroup=null;
  for(const item of solution){
    const part=item.writtenPart;
    const pass=item.repeatPass || 1;
    if(part!==previousPart || pass!==previousPass){
      const key=String(part);
      const count=(occurrence.get(key)||0)+1;
      occurrence.set(key,count);
      currentGroup={part,pass:count,items:[]};
      groups.set(groups.size,currentGroup);
      previousPart=part;
      previousPass=pass;
    }
    currentGroup.items.push(item);
  }
  const passesByPart=new Map();
  for(const group of groups.values()){
    passesByPart.set(group.part, Math.max(passesByPart.get(group.part)||0,group.pass));
  }
  for(const group of groups.values()){
    const total=group.items.length;
    group.items.forEach((item,i)=>{
      item.partLocation={name:partLetter(group.part),pass:group.pass,partPasses:passesByPart.get(group.part),index:i+1,total};
    });
  }
  return solution;
}

function expandSolutionForRepeats(abc, solution) {
  if(!solution || !solution.length)return solution||[];
  const controls=repeatControlTokens(abc);
  const events=solution.map(item=>({type:'note',pos:item.abcIndex,item})).concat(controls);
  const rank={start:0,first:1,second:1,end:2,double:2,note:3};
  events.sort((a,b)=>a.pos-b.pos||rank[a.type]-rank[b.type]);
  const firstToSecond=new Map(),secondToAfter=new Map();
  for(let i=0;i<events.length;i++){
    if(events[i].type!=='first')continue;
    let j=i+1;
    while(j<events.length && events[j].type!=='second')j++;
    if(j<events.length){firstToSecond.set(i,j);secondToAfter.set(j,i)}
  }
  const output=[],visits=new Map();
  let pc=0,start=0,pass=1,first=null,steps=0;
  while(pc<events.length && steps++<events.length*12+100){
    const e=events[pc];
    if(e.type==='note'){
      output.push({...e.item,repeatPass:pass});pc++;continue;
    }
    if(e.type==='start'){
      // An explicit |: begins a fresh section, even when the previous
      // section finished on its second ending without a closing :|.
      // Only preserve pass 2 when jumping back to this very same |:.
      if(pass===2 && start===pc+1){pc++;continue}
      pass=1;
      start=pc+1;
      first=null;
      pc++;continue;
    }
    if(e.type==='first'){
      if(pass===2){
        const second=firstToSecond.get(pc);
        if(second!=null){pc=second+1;continue}
      }
      first=pc;pc++;continue;
    }
    if(e.type==='second'){
      if(pass===1 && first!=null){
        // First/second endings without an explicit :|.
        pass=2;pc=start;continue;
      }
      // After the second ending, the following repeat is a new section.
      // Its |: will initialize its own first pass.
      first=null;pc++;continue;
    }
    if(e.type==='end'){
      const count=visits.get(pc)||0;
      if(count===0){
        visits.set(pc,1);
        pass=2;pc=start;continue;
      }
      visits.set(pc,2);
      pass=1;first=null;start=pc+1;pc++;continue;
    }
    pc++;
  }
  return output.length?output:solution.slice();
}

$("generateBtn").addEventListener("click", async()=>{
  if (!loadedABC || !validTunes(loadedABC).length) return;
  if (typeof JSZip==="undefined") { setStatus("JSZip is not loaded."); return; }
  const system=$("system").value, style=$("style").value;
  const exportTunes=validTunes(loadedABC);
  const titleCounts=new Map();
  for (let ti=0;ti<exportTunes.length;ti++) {
    const base=sanitize(firstTitle(exportTunes[ti],ti+1));
    titleCounts.set(base,(titleCounts.get(base)||0)+1);
  }
  const titleOccurrences=new Map();
  const zip=new JSZip();
  $("generateBtn").disabled=true; $("openFile").disabled=true;
  try {
    let totalImages=0, skipped=[];
    for (let ti=0; ti<exportTunes.length; ti++) {
      const tune=exportTunes[ti], title=firstTitle(tune,ti+1);
      setStatus(`Solving ${ti+1} of ${exportTunes.length}: ${title}`);
      let solution;
      try {
        // angloFingeringsGenerator contains the solver implementation and
        // publishes solveAngloTune when invoked. Set the requested options
        // before entering it so the first tune works as well as later tunes.
        gInjectTab_ConcertinaStyle = system === "wheatstone" ? 1 : 0;
        gInjectTab_ConcertinaFingering = angloFingeringMode(style);
        const tuneForSolver = stripChordSymbols(tune);
        solution = angloFingeringsGenerator(tuneForSolver);
        applyInjectedTabOverrides(tune, solution);
        identifyWrittenParts(tune, solution);
        solution = expandSolutionForRepeats(tune, solution);
        labelPartOccurrences(solution);
      }
      catch(err) { skipped.push(`${title}: ${err.message||err}`); continue; }
      const base=sanitize(title);
      const occurrence=(titleOccurrences.get(base)||0)+1;
      titleOccurrences.set(base,occurrence);
      const filenameBase=titleCounts.get(base)>1 ? `${String(occurrence).padStart(3,"0")}_${base}` : base;
      for (let i=0;i<solution.length;i++) {
        const item=solution[i];
        setStatus(`Generating ${title}: image ${i+1} of ${solution.length}`);
        const canvas=makeCanvas(title,solution,item,system,style,i+1,tune);
        const blob=await canvasBlob(canvas);
        const loc=item.partLocation;
        const filename=`${filenameBase}_${loc.name}_${String(loc.pass).padStart(2,"0")}_${String(loc.index).padStart(3,"0")}.jpg`;
        zip.file(filename,blob);
        totalImages++;
        if ((i&7)===7) await new Promise(r=>setTimeout(r,0));
      }
    }
    if (!totalImages) throw new Error(skipped.length ? "No images generated. "+skipped.join(" | ") : "No notes found.");
    const zipFirst = exportTunes.length > 1 ? "Multiple" : sanitize(firstTitle(exportTunes[0], 1)).replace(/\s+/g, "_");
    const zipSystem = system === "jeffries" ? "Jeffries" : "Wheatstone";
    const zipStyle = style === "cross-cpush" ? "Cross-Row-C5-C-Row-Push" : (style === "cross" ? "Cross-Row" : "On-Row");
    const suggested = `${zipFirst}_${zipSystem}_${zipStyle}.zip`;
    const zipName=await askZipName(suggested);
    if (!zipName) { setStatus("Save canceled."); return; }
    setStatus("Building ZIP file…");
    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=zipName;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    setStatus(`Saved ${totalImages} JPEG image${totalImages===1?"":"s"} in ${zipName}.`+
      (skipped.length?`\nSkipped: ${skipped.join(" | ")}`:""));
  } catch(err) {
    setStatus("Generation failed: "+(err.message||err));
  } finally {
    $("generateBtn").disabled=!validTunes(loadedABC).length; $("openFile").disabled=false;
  }
});



const CIRCLED_BUTTON_NUMBERS={"①":1,"②":2,"③":3,"④":4,"⑤":5,"⑥":6,"⑦":7,"⑧":8,"⑨":9,"⑩":10};
function parseInjectedConcertinaTab(text){
  if(!text)return null;
  let t=String(text).trim().replace(/^[_^]/,"").trim();
  const direction=t.includes("↓")?"push":t.includes("↑")?"draw":null;
  if(!direction)return null;
  let hand=null,num=null;
  for(const glyph of Object.keys(CIRCLED_BUTTON_NUMBERS))if(t.includes(glyph)){hand="R";num=CIRCLED_BUTTON_NUMBERS[glyph];break}
  if(num==null){const m=t.match(/(?:^|\s)(10|[1-9])(?=\s*[*;↓↑]|\s*$)/);if(m){hand="L";num=parseInt(m[1],10)}}
  if(num==null)return null;
  const topRow=/\*/.test(t);if(topRow&&num>5)return null;
  return {button:hand+String(num)+(topRow?"a":""),direction};
}
function injectedTabBeforeNote(abc,noteIndex){
  const before=abc.slice(0,noteIndex),m=before.match(/"([^"\r\n]*)"[ \t]*$/);
  return m?parseInjectedConcertinaTab(m[1]):null;
}
function applyInjectedTabOverrides(abc,automaticSolution){
  for(const item of automaticSolution){const o=injectedTabBeforeNote(abc,item.abcIndex);if(o){item.button=o.button;item.direction=o.direction;item.injectedTabOverride=true}}
  return automaticSolution;
}
$("openFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  loadedABC = await f.text();
  loadedFileName = f.name;
  const loadedTunes = validTunes(loadedABC);
  $("generateBtn").disabled = !loadedTunes.length;
  $("fileInfo").textContent = `${f.name} — ${loadedTunes.length} tune${loadedTunes.length===1?"":"s"}`;
  setStatus(loadedTunes.length ? `Loaded ${f.name}. Ready to generate fingering images.` : `No valid ABC tunes found in ${f.name}. A tune needs a K: key field and music notes.`);
});
