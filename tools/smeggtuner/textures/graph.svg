<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Graph paper, five minor cells to a major one, in one tile because a mask has one size
       for all layers. Minor lines carry less than half the ink. -->
  <g stroke="#000" fill="none">
    <path stroke-width="1" opacity="0.4"
          d="M0 20.5 H100 M0 40.5 H100 M0 60.5 H100 M0 80.5 H100
             M20.5 0 V100 M40.5 0 V100 M60.5 0 V100 M80.5 0 V100"/>
    <path stroke-width="1" d="M0 0.5 H100 M0.5 0 V100"/>
  </g>
</svg>
