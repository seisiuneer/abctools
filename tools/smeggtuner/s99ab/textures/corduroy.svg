<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8">
  <!-- Soft-edged vertical ribs: a gradient from opaque at the centre to clear at both sides. -->
  <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#000" stop-opacity="1"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <rect width="8" height="8" fill="url(#r)"/>
</svg>
