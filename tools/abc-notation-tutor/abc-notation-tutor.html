<body>
<div class="app">
  <header class="heroCard">
    <div class="heroTop">
      <h1 class="heroTitle">ABC Notation Tutor</h1>
      <p class="heroText">Learn ABC notation in 15 progressive, interactive lessons.<br/>Edit the examples, see the notation update, and hear the result.</p>
    </div>
  </header>

  <main class="main">
    <aside class="left">
      <section class="card lessonsCard" id="lessonsCard">
        <div class="sectionHeadingRow">
          <div>
            <h2>Lessons</h2>
            <div id="progressText" class="muted small"></div>
          </div>
          <button id="resetProgressBtn" class="danger compact" type="button">Mark All Uncompleted</button>
        </div>
        <div id="lessonList" class="lessonList" aria-label="ABC lessons"></div>
      </section>
    </aside>

    <section class="right">
      <section class="card lessonHeaderCard" id="lessonHeaderCard">
        <div class="lessonTitleRow">
          <div>
            <div id="lessonNumber" class="eyebrow"></div>
            <h2 id="lessonTitle"></h2>
          </div>
          <div class="headerActions">
            <button id="tourBtn" class="tourButton" type="button">Start Lesson</button>
            <button id="completeBtn" type="button">Mark Completed</button>
          </div>
        </div>
        <p id="lessonSummary" class="lessonSummary"></p>
        <div id="lessonGoals" class="goals"></div>
      </section>

      <section class="card notesCard" id="notesCard">
        <h3>Lesson Notes</h3>
        <div id="lessonNotes" class="lessonNotes"></div>
        <div class="lessonNav">
          <button id="prevLessonBtn" class="secondary" type="button">Previous Lesson</button>
          <button id="nextLessonBtn" type="button">Next Lesson</button>
        </div>
      </section>

      <div class="workGrid">
        <section class="card editorCard" id="editorCard">
          <div class="sectionHeadingRow">
            <div>
              <h3>ABC Editor</h3>
              <div class="muted small">Try changing the example. Rendering updates automatically.</div>
            </div>
            <button id="restoreExampleBtn" class="secondary compact" type="button">Restore Example</button>
          </div>
          <textarea id="abcEditor" spellcheck="false" aria-label="ABC editor"></textarea>
          <div id="status" class="status" aria-live="polite"></div>
        </section>

        <section class="card notationCard" id="notationCard">
          <div class="sectionHeadingRow">
            <div>
              <h3>Notation & Playback</h3>
            </div>
          </div>
          <div id="paper" class="paper"></div>
          <div id="audio" class="audio"></div>
        </section>
      </div>


    </section>
  </main>
</div>

<script type="text/javascript" src="abcjs-eskin-portable.js?v=20260901-135500"></script>
